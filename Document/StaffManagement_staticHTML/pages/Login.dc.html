<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/Login.css">
  </head>
  <body class="page page--login">
    <div class="app-root">
      <div class="screen">
        <div class="layout-072">
          <div class="utility-006">
            <div class="text-075">HIGHCLASS</div>
            <h1 class="text-155">ハイクラス業務管理システム</h1>
          </div>
          <form class="layout-158">
            <div class="layout-055"><label for="lg-mail" class="text-042">メールアドレス</label><input id="lg-mail" type="email" autocomplete="username" placeholder="例:hanako@example.com" required="" class="text-076"></div>
            <div class="layout-055"><label for="lg-pass" class="text-042">パスワード</label><input id="lg-pass" type="password" autocomplete="current-password" required="" class="text-076"></div>
            <label class="control-048"><input type="checkbox" checked="" class="space-009">ログインしたままにする</label><button type="button" class="control-004">ログイン</button><a href="SetPassword.dc.html" class="text-156">パスワードを忘れた方</a></form>
          <p class="text-157">アカウントは社員からの招待で作成されます。<br>依頼や出勤確認は、メール・LINEのリンクから<br>ログインせずに回答できます。</p></div>
      </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
